[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-base-backend"
version = "0.1.0"
description = "FastAPI backend for the knowledge base service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "sqlalchemy==2.0.36",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "chromadb>=1.5.7,<2.0.0",
    "onnxruntime>=1.23.2,<2.0.0",
    "sentence-transformers>=3.3.1,<4.0.0",
    "openai>=2.31.0",
    "requests>=2.33.1",
    "langchain==0.3.27",
    "langchain-core==0.3.79",
    "langchain-community==0.3.27",
    "langchain-openai==0.3.35",
    "langchain-chroma==0.2.6",
]

[project.scripts]
start = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
